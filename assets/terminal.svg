<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Terminal sobre Szmyskup">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="#07020f"/>
    <rect width="1000" height="260" fill="url(#glow)"/>
    <rect width="1000" height="44" fill="#0f0620"/>
    <rect y="44" width="1000" height="1" fill="#2a1450"/>
    <circle cx="30" cy="22" r="6" fill="#a855f7"/>
    <circle cx="52" cy="22" r="6" fill="#ffffff" opacity="0.85"/>
    <circle cx="74" cy="22" r="6" fill="#4c1d95"/>
    <text x="500" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" fill="#9d7bd8">szmyskup@terminal ~ </text>

    <g font-family="'Courier New', Courier, monospace" font-size="20">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.12;1" dur="1.2s" fill="freeze"/>
        <text x="40" y="88" fill="#a855f7">$</text>
        <text x="64" y="88" fill="#ffffff">whoami</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.5;1" dur="2.2s" fill="freeze"/>
        <text x="64" y="118" fill="#e9d5ff">Szmyskup · Designer &amp; Developer</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.7;1" dur="3.2s" fill="freeze"/>
        <text x="40" y="156" fill="#a855f7">$</text>
        <text x="64" y="156" fill="#ffffff">cat missao.txt</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.8;1" dur="4.2s" fill="freeze"/>
        <text x="64" y="186" fill="#e9d5ff">Transformar ideias em realidade digital.</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.9;1" dur="5.2s" fill="freeze"/>
        <text x="40" y="224" fill="#a855f7">$</text>
        <rect x="66" y="207" width="12" height="22" fill="#c084fc">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
